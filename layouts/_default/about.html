{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-5xl font-bold mb-6 text-text-primary">{{ .Title }}</h1>

    <div class="flex flex-col gap-8">
        <div class="flex-grow">
            <div class="bg-bg-secondary p-8 rounded-lg mb-8 border border-border-primary">
                <div class="about-content text-text-secondary text-lg leading-relaxed">
                    {{ .Content }}
                </div>
            </div>

            <style>
                .about-content p {
                    margin-bottom: 1.5rem;
                }
                .about-content p:last-child {
                    margin-bottom: 0;
                }
            </style>

            {{ $authorData := index site.Data .Language.Lang "author" }}

            <div class="bg-bg-secondary p-6 md:p-8 rounded-lg mb-8 border border-border-primary">
                <h2 class="text-2xl md:text-3xl font-bold mb-4 md:mb-6 text-text-primary">Certifications</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {{ range site.Params.certifications }}
                    <div class="flex flex-col h-full p-4 md:p-6 rounded-lg bg-bg-tertiary border border-border-primary">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg md:text-xl font-semibold text-text-primary">
                                {{ .title }}
                            </h3>
                        </div>
                        <p class="text-text-secondary text-sm">{{ .company }} - {{ .date }}</p>
                    </div>
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
