baseURL = "https://www.bengregory.me/"
languageCode = 'en-us'
title = 'Ben Gregory - Implementation & Customer Solutions Engineer'
theme = 'hugo-noir'
enableRobotsTXT = true

relativeURLs = true
canonifyURLs = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    title = "Ben Gregory - Implementation & Customer Solutions Engineer"
    weight = 1
    contentDir = "content/en"
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.en.menu.main]]
        name = "Projects"
        pageRef = "/projects"
        weight = 2
      [[languages.en.menu.main]]
        name = "Links I Like"
        pageRef = "/links"
        weight = 3
      [[languages.en.menu.main]]
        name = "Resume"
        pageRef = "/experience"
        weight = 4
      [[languages.en.menu.main]]
        name = "Connect"
        pageRef = "/contact"
        weight = 5

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  name = "Ben Gregory"
  profile_image = "/images/profile.jpg"
  email = "ben@bengregory.me"
  github = "https://github.com/bgmakesithappen"
  github_username = "bgmakesithappen"
  linkedin = "https://www.linkedin.com/in/bgmakesithappen/"
  linkedin_username = "bgmakesithappen"

  description = "Ben Gregory — Implementation & Customer Solutions Engineer specializing in enterprise onboarding, Linux server deployment, and automation."

  # Home page "What I work with" carousel. Only list tech backed up by the resume or a project page.
  [params.tech]
  # Row 1: infrastructure & cloud
  row1 = [
    { icon = "devicon-amazonwebservices-plain-wordmark", name = "AWS" },
    { icon = "devicon-linux-plain", name = "Linux" },
    { icon = "devicon-almalinux-plain", name = "AlmaLinux" },
    { icon = "devicon-docker-plain", name = "Docker" },
    { icon = "devicon-kubernetes-plain", name = "Kubernetes" },
    { icon = "devicon-nginx-original", name = "Nginx" },
    { icon = "devicon-postgresql-plain", name = "PostgreSQL" },
    { icon = "devicon-microsoftsqlserver-plain", name = "SQL Server" },
    { icon = "devicon-portainer-original", name = "Portainer" },
    { svg = "authentik", name = "authentik" },
    { svg = "openid", name = "OIDC" },
    { icon = "devicon-okta-plain", name = "Okta" }
  ]
  # Row 2: scripting, automation & delivery tooling
  row2 = [
    { icon = "devicon-python-plain", name = "Python" },
    { icon = "devicon-bash-plain", name = "Bash" },
    { icon = "devicon-javascript-plain", name = "JavaScript" },
    { icon = "devicon-git-plain", name = "Git" },
    { icon = "devicon-github-original", name = "GitHub" },
    { icon = "devicon-jira-plain", name = "Jira" },
    { svg = "linear", name = "Linear" },
    { icon = "devicon-confluence-plain", name = "Confluence" },
    { icon = "devicon-salesforce-plain", name = "Salesforce" }
  ]

  [[params.certifications]]
    title = "AWS Certified Cloud Practitioner"
    company = "Amazon Web Services"
    date = "Active"
    url = "https://www.credly.com/badges/48458dc0-16da-4fe6-a33b-599943204d81/public_url"

# PostHog Analytics
# API key is read from HUGO_POSTHOG_API_KEY environment variable
[params.posthog]
  enabled = true
  apiHost = "https://us.i.posthog.com"  # Use https://eu.i.posthog.com for EU cloud

# Security - allow access to PostHog env var
[security.funcs]
  getenv = ['^HUGO_', '^CI$']
