{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-5xl font-bold mb-6 text-text-primary">{{ .Title }}</h1>
    <div class="bg-bg-secondary p-8 rounded-lg border border-border-primary">
        <div class="prose prose-lg max-w-none">
            <div class="text-text-secondary text-lg mb-8">
                {{ .Content }}
            </div>

            <div class="flex flex-wrap justify-center gap-4">
                <!-- Email -->
                <a href="mailto:{{ .Site.Params.email }}" class="contact-link flex items-center gap-3 px-6 py-3 rounded-lg bg-bg-tertiary transition-all duration-300">
                    <svg class="w-6 h-6 text-text-secondary shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.75">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <span class="text-text-primary font-medium">Email</span>
                </a>

                <!-- LinkedIn -->
                <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener noreferrer" class="contact-link flex items-center gap-3 px-6 py-3 rounded-lg bg-bg-tertiary transition-all duration-300">
                    <svg class="w-6 h-6 text-text-secondary shrink-0" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M20.47 2H3.53a1.45 1.45 0 0 0-1.47 1.43v17.14A1.45 1.45 0 0 0 3.53 22h16.94a1.45 1.45 0 0 0 1.47-1.43V3.43A1.45 1.45 0 0 0 20.47 2ZM8.09 18.74h-3v-9h3ZM6.59 8.48a1.56 1.56 0 1 1 0-3.12a1.57 1.57 0 1 1 0 3.12Zm12.32 10.26h-3v-4.83c0-1.21-.43-2-1.52-2A1.65 1.65 0 0 0 12.85 13a2 2 0 0 0-.1.73v5h-3v-9h3V11a3 3 0 0 1 2.71-1.5c2 0 3.45 1.29 3.45 4.06Z"/>
                    </svg>
                    <span class="text-text-primary font-medium">LinkedIn</span>
                </a>

                <!-- GitHub -->
                <a href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer" class="contact-link flex items-center gap-3 px-6 py-3 rounded-lg bg-bg-tertiary transition-all duration-300">
                    <svg class="w-6 h-6 text-text-secondary shrink-0" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    <span class="text-text-primary font-medium">GitHub</span>
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .contact-link {
        position: relative;
        overflow: hidden;
        border: 1px solid #2d2d4a;
    }

    .contact-link:hover {
        border-color: #00d4ff;
        transform: translateY(-2px);
    }

    @media (max-width: 768px) {
        .contact-link {
            width: 100%;
        }
    }
</style>
{{ end }}
