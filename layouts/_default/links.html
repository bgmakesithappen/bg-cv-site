{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-12">
    <h1 class="text-5xl font-bold mb-6 text-text-primary">{{ .Title }}</h1>

    <div class="bg-bg-secondary p-6 md:p-8 rounded-lg border border-border-primary">
        <p class="text-text-secondary text-lg mb-6">
            {{ .Description }}
        </p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {{ $linksData := index site.Data .Language.Lang "links" }}
            {{ range $linksData.categories }}
                {{ range .links }}
                <a href="{{ .url }}"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="group flex flex-col h-full p-4 md:p-6 rounded-lg bg-bg-tertiary border border-border-primary hover:border-accent hover:shadow-md transition-all duration-300">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="inline-flex items-center text-lg md:text-xl font-semibold text-text-primary group-hover:text-accent transition-colors duration-200">
                            {{ .title }}
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-2 opacity-50 group-hover:opacity-100 transition-opacity duration-200">
                                <path d="M7 17l9.2-9.2M17 17V7H7"/>
                            </svg>
                        </h3>
                    </div>
                    {{ if .description }}
                    <p class="text-text-secondary text-sm">{{ .description }}</p>
                    {{ end }}
                </a>
                {{ end }}
            {{ end }}
        </div>
    </div>
</div>
{{ end }}
